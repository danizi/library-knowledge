<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识看板</title>
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("lk-kanban-ui") || localStorage.getItem("lk-kanban-v1") || "null");
        var choice = (saved && (saved.appearance || (saved.ui && saved.ui.appearance))) || "system";
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.mode = "light";
      }
    })();
  </script>
  <style>
    :root, [data-mode="light"] {
      color-scheme: light;
      --bg: #f2f2f7;
      --sidebar: #ebebf0;
      --card: #ffffff;
      --ink: #1d1d1f;
      --secondary: #4a4a4f;
      --fill: #e3e3e8;
      --separator: rgba(60, 60, 67, 0.18);
      --button: #0058c5;
      --button-hover: #004a9e;
      --button-text: #ffffff;
      --blue-text: #0058c5;
      --figure: #f5f5f7;
      --shadow: 0 1px 1px rgba(0, 0, 0, 0.05), 0 8px 22px rgba(0, 0, 0, 0.06);
      --danger: #c4121a;
      --scrim: rgba(0, 0, 0, 0.32);
      --toast-bg: #1d1d1f;
      --toast-ink: #f5f5f7;
    }
    [data-mode="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --sidebar: #2c2c2e;
      --card: #3a3a3c;
      --ink: #f5f5f7;
      --secondary: #c7c7cc;
      --fill: #48484a;
      --separator: rgba(255, 255, 255, 0.14);
      --button: #0058c5;
      --button-hover: #1a6ad4;
      --button-text: #ffffff;
      --blue-text: #9ecbff;
      --figure: #2c2c2e;
      --shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.4);
      --danger: #ff6961;
      --scrim: rgba(0, 0, 0, 0.55);
      --toast-bg: #f5f5f7;
      --toast-ink: #1d1d1f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {

      background-repeat: no-repeat;

      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23c7c7cc' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");

    .segment {

    }

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script>
    (function () {
      const KEY = "lk-kanban-v1";
      if (window.marked && window.marked.use) {
        window.marked.use({ gfm: true, breaks: true });
      }
      function dressMarkdown(view) {
        view.querySelectorAll("table").forEach(function (table) {
          if (table.parentElement && table.parentElement.classList.contains("table-scroll")) return;
          const wrap = document.createElement("div");
          wrap.className = "table-scroll";
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        });
        view.querySelectorAll("pre").forEach(function (pre) {
          const code = pre.querySelector("code");
          const match = /language-([\w+-]+)/.exec((code && code.className) || "");
          if (!match || pre.querySelector(".code-lang")) return;
          const label = document.createElement("span");
          label.className = "code-lang";
          label.textContent = match[1];
          pre.insertBefore(label, pre.firstChild);
        });
      }
      const COLUMNS = [
        { id: "todo", name: "未开始", tint: "gray", empty: "计划或索引里标了待建、仓库还没有正文的，会在这里。" },
        { id: "doing", name: "在学", tint: "blue", empty: "已经写了、还没标审查的卡在这里。" },
        { id: "review", name: "待审查", tint: "orange", empty: "文首或索引写了仍待审查、仍待审卡的，会在这里。" },
        { id: "done", name: "已掌握", tint: "green", empty: "能默答的时候，把卡拖到这里。快照不会替你标已掌握。" }
      ];
      const DOMAINS = ["全部", "Android", "Web", "Tools", "工作台", "示例"];
      const KINDS = ["全部", "概念", "过程", "计划", "题库", "错题", "笔记", "示例"];
      const ICONS = {
        search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        close: '<path d="M6 6l12 12M18 6L6 18"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1 1M17.4 17.4l1 1M18.4 5.6l-1 1M6.6 17.4l-1 1"/>',
        moon: '<path d="M20 14.5A8.2 8.2 0 1 1 9.5 4 6.6 6.6 0 0 0 20 14.5z"/>',
        auto: '<path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3v9h9"/>'
      };
      const PLUGINS = {};
      let mermaidState = window.mermaid ? "ready" : "loading";
      let renderChain = Promise.resolve();
      let renderSeq = 0;
      let dragId = "";
      let suppressClick = false;
      let persistTimer = 0;
      let toastTimer = 0;
      let dialogAction = null;

      function registerPlugin(plugin) { PLUGINS[plugin.type] = plugin; }
      function nid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 8); }
      function icon(name) {
        const span = document.createElement("span");
        span.className = "icon";
        span.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + "</svg>";
        return span;
      }
      function el(tag, attrs) {
        const node = document.createElement(tag);
        if (attrs) {
          Object.keys(attrs).forEach(function (k) {
            const v = attrs[k];
            if (v == null || v === false) return;
            if (k === "class") node.className = v;
            else if (k === "text") node.textContent = v;
            else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
            else node.setAttribute(k, v === true ? "" : String(v));
          });
        }
        for (let i = 2; i < arguments.length; i++) {
          const child = arguments[i];
          if (child == null || child === false) continue;
          node.append(child.nodeType ? child : document.createTextNode(String(child)));
        }
        return node;
      }
      function safeSrc(src) {
        const s = (src || "").trim();
        if (!s || /^javascript:/i.test(s) || /^vbscript:/i.test(s)) return "";
        if (s.slice(0, 5) === "data:") return /^data:image\//i.test(s) ? s : "";
        return s;
      }
      function hash(s) {
        let h = 0;
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
        return String(h);
      }
      function blockKey(block) {
        const raw = block.type === "image" ? (block.src || "") + "\n" + (block.alt || "") : (block.source || "");
        return block.type + ":" + hash(raw);
      }
      function columnName(id) {
        const col = COLUMNS.find(function (c) { return c.id === id; });
        return col ? col.name : id;
      }
      const UI_KEY = "lk-kanban-ui";
      function defaultUi() {
        return { q: "", domain: "全部", kind: "全部", selected: null, appearance: "system", panel: "markdown", mdStyle: "system" };
      }
      const SEED = [];
      function loadUi() {
        try {
          const saved = JSON.parse(localStorage.getItem(UI_KEY) || "null");
          return Object.assign(defaultUi(), saved || {});
        } catch (e) {
          return defaultUi();
        }
      }
      function clone(v) { return JSON.parse(JSON.stringify(v)); }
      const state = { cards: [], online: false };
      const ui = loadUi();
      ui.panel = ui.panel === "text" ? "text" : "markdown";
      let saveTimer = 0;
      const dirty = new Set();

      function cardById(id) { return state.cards.find(function (c) { return c.id === id; }) || null; }
      function findCard(id) {
        const nodes = document.querySelectorAll(".card");
        for (let i = 0; i < nodes.length; i++) if (nodes[i].dataset.id === id) return nodes[i];
        return null;
      }
      function queryOk(card, q) {
        const query = (q || "").trim().toLowerCase();
        if (!query) return true;
        const bits = [card.title, card.code, card.summary, card.body, card.domain, card.kind, card.path].concat(card.tags || []);
        (card.blocks || []).forEach(function (b) { bits.push(b.text, b.source, b.alt, b.type); });
        return bits.filter(Boolean).join("\n").toLowerCase().indexOf(query) !== -1;
      }
      function matchParts(card, part) {
        if (part.domain !== "全部" && (card.chapter || card.domain) !== part.domain) return false;
        return queryOk(card, part.q);
      }
      function matches(card) { return matchParts(card, ui); }
      function filterActive() { return Boolean(ui.q.trim() || ui.domain !== "全部" || ui.kind !== "全部"); }
      function faceLine(card) {
        if ((card.summary || "").trim()) return card.summary.trim();
        const text = (card.blocks || []).find(function (b) { return b.type === "text" && (b.text || "").trim(); });
        return text ? text.text.trim().split("\n")[0] : "";
      }
      function metaLine(card) {
        const bits = [];
        if (card.kind) bits.push(card.kind);
        if (card.domain && card.domain !== card.kind) bits.push(card.domain);
        (card.tags || []).forEach(function (tag) { if (bits.indexOf(tag) === -1) bits.push(tag); });
        return bits.join(" · ");
      }

      function setupMermaid() {
        if (!window.mermaid) return;
        const dark = document.documentElement.dataset.mode === "dark";
        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: "base",
          fontFamily: '-apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif',
          themeVariables: dark ? {
            background: "#2c2c2e",

          return;

        host.dataset.token = token;
        renderChain = renderChain.then(function () {
          if (host.dataset.token !== token) return null;
          return window.mermaid.render("diagram" + token, src);
        }).then(function (out) {

            svg.style.maxHeight = "168px";
            svg.style.width = "100%";
            svg.style.height = "auto";

      function markdownToBlocks(markdown) {
        const blocks = [];
        const source = String(markdown || "");
        const fence = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
        let last = 0;
        let match;
        function takeText(chunk) {
          const img = /!\[([^\]]*)\]\(([^)\s]+)\)/g;
          let cursor = 0;
          let found;
          while ((found = img.exec(chunk))) {
            const before = chunk.slice(cursor, found.index).trim();
            if (before) blocks.push({ id: nid("b"), type: "text", text: before });
            blocks.push({ id: nid("b"), type: "image", src: found[2], alt: found[1] || "" });
            cursor = found.index + found[0].length;
          }
          const rest = chunk.slice(cursor).trim();
          if (rest) blocks.push({ id: nid("b"), type: "text", text: rest });
        }
        while ((match = fence.exec(source))) {
          takeText(source.slice(last, match.index));
          const lang = (match[1] || "").toLowerCase();
          const inner = match[2].replace(/\n$/, "");
          if (lang === "mermaid" || (!lang && /^(sequenceDiagram|classDiagram|stateDiagram|flowchart|graph)\b/.test(inner.trim()))) {
            blocks.push({ id: nid("b"), type: diagramType(inner), source: inner });
          } else {
            blocks.push({ id: nid("b"), type: "text", text: match[0] });
          }

        }

          dirty.delete(id);
          const card = cardById(id);
          if (!card) return Promise.resolve();
          return api("/api/cards/" + encodeURIComponent(card.id), {
            method: "PUT",
            body: JSON.stringify(cardPayload(card))
          }).catch(function () { /* 没写上的改动，以随后读到的文件为准 */ });
        });
        return Promise.all(writes).then(function () {
          return api("/api/cards");
        }).then(function (data) {
          applyCards(data);
          toast("已按本地文件刷新。");
        }).catch(function () {
          state.online = false;
          renderBoard();
          updateNav();
          toast("没有连上看板服务。");
        }).then(function () {
          buttons.forEach(function (btn) { if (btn) btn.disabled = false; });
        });
      }
      function boot() {
        applyMode(false);
        setupMermaid();
        api("/api/cards").then(function (data) {
          applyCards(data);
          showDbFoot();
        }).catch(function () {
          state.online = false;
          renderBoard();
          updateNav();
          showDbFoot();
        });
      }
      boot();
    })();
  </script>
  <noscript>知识看板需要在浏览器里运行脚本。</noscript>
</body>
</html>
