<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识看板</title>
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("lk-kanban-ui") || localStorage.getItem("lk-kanban-v1") || "null");
        var choice = (saved && (saved.appearance || (saved.ui && saved.ui.appearance))) || "system";
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.mode = "light";
      }
    })();
  </script>
  <style>
    :root, [data-mode="light"] {
      color-scheme: light;
      --bg: #f2f2f7;
      --sidebar: #ebebf0;
      --card: #ffffff;
      --ink: #1d1d1f;
      --secondary: #4a4a4f;
      --fill: #e3e3e8;
      --separator: rgba(60, 60, 67, 0.18);
      --button: #0058c5;
      --button-hover: #004a9e;
      --button-text: #ffffff;
      --blue-text: #0058c5;
      --figure: #f5f5f7;
      --shadow: 0 1px 1px rgba(0, 0, 0, 0.05), 0 8px 22px rgba(0, 0, 0, 0.06);
      --danger: #c4121a;
      --scrim: rgba(0, 0, 0, 0.32);
      --toast-bg: #1d1d1f;
      --toast-ink: #f5f5f7;
    }
    [data-mode="dark"] {
      color-scheme: dark;
      --bg: #1c1c1e;
      --sidebar: #2c2c2e;
      --card: #3a3a3c;
      --ink: #f5f5f7;
      --secondary: #c7c7cc;
      --fill: #48484a;
      --separator: rgba(255, 255, 255, 0.14);
      --button: #0058c5;
      --button-hover: #1a6ad4;
      --button-text: #ffffff;
      --blue-text: #9ecbff;
      --figure: #2c2c2e;
      --shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.08), 0 8px 24px rgba(0, 0, 0, 0.4);
      --danger: #ff6961;
      --scrim: rgba(0, 0, 0, 0.55);
      --toast-bg: #f5f5f7;
      --toast-ink: #1d1d1f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: color-mix(in srgb, var(--button) 28%, transparent); }
    ::placeholder { color: var(--secondary); opacity: 1; }
    :focus-visible { outline: 2px solid var(--button); outline-offset: 2px; }
    button, summary {
      font: inherit;
      color: var(--blue-text);
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button.primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 14px;
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
    }
    button.primary:hover { background: var(--button-hover); }
    button.danger-fill {
      min-height: 32px;
      padding: 0 14px;
      background: var(--danger);
      color: #fff;
      font-weight: 600;
    }
    button:disabled { opacity: 0.38; cursor: default; }
    .icon { width: 18px; height: 18px; display: inline-flex; }
    .icon svg { width: 18px; height: 18px; display: block; }
    button.primary .icon { width: 16px; height: 16px; }
    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 0;
    }
    .app.with-inspector { grid-template-columns: 220px minmax(0, 1fr) minmax(300px, 400px); }
    .sidebar {
      min-height: 0;
      overflow: auto;
      background: var(--sidebar);
      border-right: 1px solid var(--separator);
      padding: 22px 12px 16px;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--ink) 28%, transparent) transparent;
    }
    .sidebar h1 {
      margin: 0;
      padding: 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .lede {
      margin: 8px 0 0;
      padding: 0 8px;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.45;
    }
    .search {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 16px 8px 0;
      padding: 0 8px;
      background: var(--fill);
      border-radius: 10px;
      color: var(--secondary);
    }
    .search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--button) 35%, transparent); }
    .search input {
      flex: 1;
      width: auto;
      margin: 0;
      padding: 8px 0;
      background: transparent;
      border-radius: 0;
    }
    .search input:focus-visible { outline: none; }
    .side-h {
      margin: 22px 8px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      color: var(--ink);
      padding: 6px 10px;
    }
    .nav-btn .n {
      font-variant-numeric: tabular-nums;
      color: var(--secondary);
      font-size: 12px;
    }
    .nav-btn[aria-current="true"] { background: var(--button); color: #fff; }
    .nav-btn[aria-current="true"] .n { color: #fff; }
    .foot {
      margin-top: auto;
      padding: 18px 8px 4px;
      color: var(--secondary);
      font-size: 12px;
    }
    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 16px 8px;
      min-height: 52px;
    }
    .grow { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 8rem; }
    .shown { margin: 0; color: var(--secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
    .mobile-title { display: none; margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .filter-toggle { display: none; }
    .appear {
      display: flex;
      padding: 2px;
      background: var(--fill);
      border-radius: 9px;
    }
    .appear button {
      width: 32px;
      height: 28px;
      padding: 0;
      border-radius: 7px;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .appear button[aria-pressed="true"] {
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .menu { position: relative; }
    .menu summary { list-style: none; color: var(--blue-text); }
    .menu summary::-webkit-details-marker { display: none; }
    .menu-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 6;
      min-width: 168px;
      padding: 6px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .menu-pop button {
      display: block;
      width: 100%;
      text-align: left;
      color: var(--ink);
      padding: 8px 10px;
    }
    .menu-pop button:hover { background: var(--fill); }
    .board {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      padding: 4px 16px 16px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--ink) 28%, transparent) transparent;
    }
    .column {
      flex: 1 0 240px;
      min-width: 240px;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: 16px;
    }
    .column[data-tint="gray"] { --tint: #8e8e93; }
    .column[data-tint="blue"] { --tint: #007aff; }
    .column[data-tint="orange"] { --tint: #ff9500; }
    .column[data-tint="green"] { --tint: #34c759; }
    .column.over { background: color-mix(in srgb, var(--tint) 12%, transparent); }
    .col-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 12px 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tint); flex: 0 0 auto; }
    .col-head h2 {
      margin: 0;
      flex: 1;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.011em;
    }
    .count { color: var(--secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
    .list {
      flex: 1;
      overflow: auto;
      padding: 0 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--ink) 28%, transparent) transparent;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 12px;
      cursor: grab;
      text-align: left;
    }
    .card:active { cursor: grabbing; }
    .card.selected { box-shadow: 0 0 0 2px var(--button), var(--shadow); }
    .card.dragging { opacity: 0.45; }
    .card.drop-before { box-shadow: inset 0 2px 0 var(--button), var(--shadow); }
    .card.drop-after { box-shadow: inset 0 -2px 0 var(--button), var(--shadow); }
    .card h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.011em;
      line-height: 1.35;
    }
    .code {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--secondary);
      margin-right: 6px;
    }
    .sum {
      margin: 6px 0 0;
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .figure, .live {
      margin-top: 10px;
      border-radius: 8px;
      background: var(--figure);
      overflow: hidden;
      padding: 8px;
    }
    .figure img, .figure svg, .live svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 168px;
    }
    .figure p, .live p { margin: 0; color: var(--secondary); font-size: 13px; }
    .figure pre, .live pre {
      margin: 8px 0 0;
      white-space: pre-wrap;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 11px;
      color: var(--secondary);
    }
    .diagram-error { color: var(--danger); }
    .meta { margin: 8px 0 0; color: var(--secondary); font-size: 12px; }
    .empty { margin: 4px 4px 8px; color: var(--secondary); font-size: 13px; line-height: 1.45; }
    .board-empty { margin: auto; max-width: 36ch; color: var(--secondary); }
    .board-empty p { margin: 0 0 12px; }
    .inspector {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-left: 1px solid var(--separator);
    }
    .inspector[hidden] { display: none; }
    .inspector-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 8px 4px 16px;
    }
    .inspector-head h2 {
      margin: 0;
      flex: 1;
      min-width: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--blue-text);
    }
    .icon-btn:hover { background: var(--fill); }
    .scroll {
      overflow: auto;
      min-height: 0;
      padding: 4px 16px 28px;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--ink) 28%, transparent) transparent;
    }
    .note {
      margin: 8px 0 0;
      color: var(--secondary);
      font-size: 13px;
    }
    .group { background: var(--card); border-radius: 12px; margin-top: 14px; }
    .row { padding: 10px 12px 12px; }
    .row + .row { box-shadow: inset 0 1px 0 var(--separator); }
    .lbl {
      display: block;
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--secondary);
    }
    input[type="text"], input[type="search"], input[type="url"], textarea, select {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--fill);
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      caret-color: var(--blue-text);
    }
    .search input[type="search"] { background: transparent; padding: 8px 0; }
    textarea { resize: vertical; min-height: 88px; line-height: 1.45; }
    textarea.code-src {
      min-height: 140px;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 12px;
    }
    select {
      appearance: none;
      padding-right: 28px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%234a4a4f' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px 12px;
    }
    [data-mode="dark"] select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23c7c7cc' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    }
    .segment {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: var(--fill);
      border-radius: 9px;
    }
    .segment button {
      flex: 1;
      color: var(--ink);
      border-radius: 7px;
      padding: 6px 2px;
      font-size: 12px;
    }
    .segment button[aria-checked="true"] {
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      font-weight: 600;
    }
    .inspector h3 {
      margin: 22px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--secondary);
    }
    .block {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 12px 12px;
      margin-top: 10px;
    }
    .block-bar { display: flex; align-items: center; gap: 2px; margin-bottom: 8px; }
    .block-bar strong { margin-right: auto; font-size: 13px; font-weight: 600; }
    .block-bar button { padding: 4px 6px; font-size: 13px; }
    .block-bar button.danger { color: var(--danger); }
    .add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .add-row button {
      background: var(--card);
      color: var(--blue-text);
      border-radius: 980px;
      padding: 6px 12px;
      box-shadow: inset 0 0 0 1px var(--separator);
    }
    .path {
      margin: 16px 0 0;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.45;
      word-break: break-all;
    }
    .path code {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 11px;
    }
    .danger-text { color: var(--danger); margin: 18px 0 0; padding-left: 0; }
    .file-row { display: flex; flex-direction: column; gap: 8px; }
    .scrim { display: none; }
    .dialog-back {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      background: var(--scrim);
      padding: 16px;
    }
    .dialog-back[hidden] { display: none; }
    .dialog {
      width: min(380px, 100%);
      background: var(--card);
      color: var(--ink);
      border-radius: 14px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22);
      padding: 20px 20px 16px;
    }
    .dialog h2 { margin: 0 0 8px; font-size: 17px; letter-spacing: -0.01em; }
    .dialog p { margin: 0; color: var(--secondary); font-size: 14px; line-height: 1.45; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 50;
      max-width: min(440px, calc(100% - 32px));
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--toast-bg);
      color: var(--toast-ink);
      font-size: 14px;
    }
    .toast[hidden] { display: none; }
    .foot { white-space: pre-wrap; word-break: break-all; }
    .mode-switch { margin: 4px 0 12px; }
    .lead { margin: 0 0 12px; color: var(--secondary); font-size: 14px; line-height: 1.5; }
    .md { font-size: 14px; line-height: 1.55; }
    .md p { margin: 0 0 10px; }
    .md h3, .md h4, .md h5 { margin: 16px 0 6px; letter-spacing: -0.02em; font-weight: 650; }
    .md ul, .md ol { margin: 0 0 10px; padding-left: 1.2em; }
    .md pre, .md code { font-family: "SF Mono", ui-monospace, Menlo, monospace; }
    .md :not(pre) > code { background: var(--fill); padding: 0 4px; border-radius: 4px; }
    .md pre { margin: 0 0 10px; background: var(--fill); padding: 10px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
    .md a { color: var(--blue-text); }
    .md img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
    .md .figure { margin: 0 0 10px; }
    @media (prefers-reduced-motion: no-preference) {
      .card.just-dropped { animation: settle 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .column.settle { animation: wash 0.6s ease-out; }
      .inspector { animation: slide 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
    }
    @keyframes settle {
      from { transform: translateY(-8px) scale(1.03); }
      to { transform: none; }
    }
    @keyframes wash {
      from { background: color-mix(in srgb, var(--tint) 22%, transparent); }
      to { background: transparent; }
    }
    @keyframes slide {
      from { transform: translateX(16px); }
      to { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card.just-dropped, .column.settle, .inspector, .sidebar { animation: none; transition: none; }
    }
    @media (max-width: 1080px) {
      .app.with-inspector { grid-template-columns: 220px minmax(0, 1fr); }
      .inspector {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(420px, 100%);
        z-index: 30;
        box-shadow: -12px 0 40px rgba(0, 0, 0, 0.18);
      }
    }
    @media (max-width: 860px) {
      .app, .app.with-inspector { grid-template-columns: minmax(0, 1fr); }
      .mobile-title, .filter-toggle { display: inline-flex; }
      .sidebar {
        position: fixed;
        z-index: 25;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(300px, 88vw);
        transform: translateX(-105%);
      }
      .sidebar.open { transform: none; }
      .scrim.show {
        display: block;
        position: fixed;
        inset: 0;
        background: var(--scrim);
        z-index: 24;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <h1>知识看板</h1>
      <p class="lede">点开看详情。可以改、可以删。编辑能在普通和 Markdown 之间换。</p>
      <div class="search">
        <span class="icon" id="search-icon"></span>
        <input id="q" type="search" placeholder="搜索标题、编码、正文" autocomplete="off" aria-label="搜索卡片" />
      </div>
      <h2 class="side-h">领域</h2>
      <div id="domain-nav"></div>
      <h2 class="side-h">类型</h2>
      <div id="kind-nav"></div>
      <p class="foot" id="db-foot">数据库在这台电脑上。</p>
    </aside>
    <div class="scrim" id="scrim"></div>
    <section class="stage">
      <div class="toolbar">
        <button type="button" class="filter-toggle" id="filter-toggle">过滤</button>
        <div class="grow">
          <p class="mobile-title">知识看板</p>
          <p class="shown" id="shown" aria-live="polite"></p>
          <button type="button" id="clear" hidden>清除过滤</button>
        </div>
        <div class="appear" role="group" aria-label="外观">
          <button type="button" data-appearance="light" aria-label="浅色"></button>
          <button type="button" data-appearance="system" aria-label="跟随系统"></button>
          <button type="button" data-appearance="dark" aria-label="深色"></button>
        </div>
        <details class="menu" id="file-menu">
          <summary>文件</summary>
          <div class="menu-pop">
            <button type="button" id="export">导出</button>
            <button type="button" id="import">导入</button>
            <button type="button" id="restore">恢复快照</button>
          </div>
        </details>
        <button type="button" class="primary" id="create"></button>
      </div>
      <div class="board" id="board"></div>
    </section>
    <aside class="inspector" id="inspector" hidden>
      <div class="inspector-head">
        <h2 id="inspector-title"></h2>
        <button type="button" class="icon-btn" id="close" aria-label="关闭"></button>
      </div>
      <div class="scroll" id="inspector-scroll"></div>
    </aside>
  </div>
  <div class="dialog-back" id="dialog" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <div class="dialog-actions">

大数据不进 Intent。","tags":[],"path":"knowledge/Android/ACT-001,2 | Intent与传参.md","blocks":[{"id":"t-57b4e","type":"text","text":"两个 Activity 之间怎么传小数据、怎么把结果送回来？Extra 有什么不能塞？\n小数据走 Extra；回传走 Result API；大数据不进 Intent。"}]},{"id":"kab348619b5","title":"配置变更与状态","code":"ACT-001,3","column":"doing","domain":"Android","kind":"概念","summary":"旋转 ViewModel 常还在；杀进程内存没了，要靠 SavedState 或磁盘。","tags":[],"path":"knowledge/Android/ACT-001,3 | 配置变更与状态.md","blocks":[{"id":"t-ab348","type":"text","text":"旋转屏幕时发生了什么、数据放哪才还在？配置变更和进程被杀（process death）差在哪？\n旋转 ViewModel 常还在；杀进程内存没了，要靠 SavedState 或磁盘。"}]},{"id":"ke7ff298786","title":"启动模式与任务栈","code":"ACT-001,4","column":"doing","domain":"Android","kind":"概念","summary":"栈顶防叠用 singleTop；回首页清上面用 singleTask；复用必 `onNewIntent` + `setIntent`。","tags":[],"path":"knowledge/Android/ACT-001,4 | 启动模式与任务栈.md","blocks":[{"id":"t-e7ff2","type":"text","text":"四种 `launchMode` 各管什么？`singleTop` 和 `singleTask` 怎么用业务举例？`onNewIntent` 何时来、要不要 `setIntent`？\n栈顶防叠用 singleTop；回首页清上面用 singleTask；复用必 `onNewIntent` + `setIntent`。"}]},{"id":"k93d8a8be8a","title":"设计模式","code":"DP-001","column":"doing","domain":"Android","kind":"概念","summary":"模式 = 给常见问题起名的标准解法，不是炫技清单。","tags":[],"path":"knowledge/Android/DP-001 | 设计模式.md","blocks":[{"id":"t-93d8a","type":"text","text":"在 Android/日常开发里，设计模式是啥？这张卡打算怎么用？\n模式 = 给常见问题起名的标准解法，不是炫技清单。"}]},{"id":"k5d037a0382","title":"开发踩坑记录","code":"ERR-001","column":"doing","domain":"Android","kind":"概念","summary":"坑多半是「生命周期假设错 / 资源命名空间撞车 / 查找作用域太大」。","tags":[],"path":"knowledge/Android/ERR-001 | 开发踩坑记录.md","blocks":[{"id":"t-5d037","type":"text","text":"这几类常见坑分别是啥原因、怎么解？（配置变更刷新 / 图片缩放 / 多模块字符串 R / findViewById 同 id）\n坑多半是「生命周期假设错 / 资源命名空间撞车 / 查找作用域太大」。"}]},{"id":"k59c155e45b","title":"Fragment","code":"FG-001","column":"doing","domain":"Android","kind":"概念","summary":"Fragment = Activity 里可装卸的子页面模块。","tags":[],"path":"knowledge/Android/FG-001 | Fragment.md","blocks":[{"id":"t-59c15","type":"text","text":"Fragment 是啥？为啥用、啥时候用？\nFragment = Activity 里可装卸的子页面模块。"}]},{"id":"k341e5976a6","title":"Fragment生命周期","code":"FG-001,1","column":"doing","domain":"Android","kind":"概念","summary":"多出来的生命周期是为了描述「同一宿主里装卸/显隐」；人活着 ≠ 房间还在。","tags":[],"path":"knowledge/Android/FG-001,1 | Fragment生命周期.md","blocks":[{"id":"t-341e5","type":"text","text":"Fragment 生命周期和 Activity 比，多记哪几段？`hide/show` 会不会每次 `onResume`？人还在时 view 会不会没了？\n多出来的生命周期是为了描述「同一宿主里装卸/显隐」；人活着 ≠ 房间还在。"}]},{"id":"ke780c629ed","title":"Navigation与Fragment","code":"FG-001,10","column":"doing","domain":"Android","kind":"概念","summary":"现代项目多用 Nav graph；手写要能讲清入栈与返回——规则与 Fragment 栈相同。","tags":[],"path":"knowledge/Android/FG-001,10 | Navigation与Fragment.md","blocks":[{"id":"t-e780c","type":"text","text":"Navigation 和手写 `FragmentManager` 怎么选？现代单 Activity 项目为啥多用 Nav？\n现代项目多用 Nav graph；手写要能讲清入栈与返回——规则与 Fragment 栈相同。"}]},{"id":"k31b58e0eba","title":"ViewPager2与Fragment","code":"FG-001,11","column":"doing","domain":"Android","kind":"概念","summary":"ViewPager2 配 FragmentStateAdapter；离屏拆 view 省内存，别手写一堆 Tab replace。","tags":[],"path":"knowledge/Android/FG-001,11 | ViewPager2与Fragment.md","blocks":[{"id":"t-31b58","type":"text","text":"ViewPager2 为啥用 `FragmentStateAdapter`？离屏页会怎样？为啥别自己 `replace` 一堆 Tab？\nViewPager2 配 FragmentStateAdapter；离屏拆 view 省内存，别手写一堆 Tab replace。"}]},{"id":"kf0c65a8894","title":"DialogFragment","code":"FG-001,2","column":"doing","domain":"Android","kind":"概念","summary":"对话框也当 Fragment 管，旋转才跟得上；裸 Dialog 不登记、不恢复。","tags":[],"path":"knowledge/Android/FG-001,2 | DialogFragment.md","blocks":[{"id":"t-f0c65","type":"text","text":"对话框为啥用 DialogFragment，不用裸 `AlertDialog.show()`？旋转后为啥还能在？\n对话框也当 Fragment 管，旋转才跟得上；裸 Dialog 不登记、不恢复。"}]},{"id":"kcabc0134b1","title":"Fragment回退栈","code":"FG-001,3","column":"doing","domain":"Android","kind":"概念","summary":"返回先拆隔断，栈空了才拆楼；入栈靠 `addToBackStack`。","tags":[],"path":"knowledge/Android/FG-001,3 | Fragment回退栈.md","blocks":[{"id":"t-cabc0","type":"text","text":"系统返回键先弹谁？`addToBackStack` 干什么？为啥 act-d5 一按返回就退出 App？\n返回先拆隔断，栈空了才拆楼；入栈靠 `addToBackStack`。"}]},{"id":"kd1fc494920","title":"Fragment通信","code":"FG-001,4","column":"doing","domain":"Android","kind":"概念","summary":"持续状态放信箱（ViewModel）；一次性结果用签收单（Result）；别互塞口袋。","tags":[],"path":"knowledge/Android/FG-001,4 | Fragment通信.md","blocks":[{"id":"t-d1fc4","type":"text","text":"两个 Fragment（或 Fragment 与 Activity）要传数据，优先用哪种方式？共享 ViewModel 和 Fragment Result API 各管啥？\n持续状态放信箱（ViewModel）；一次性结果用签收单（Result）；别互塞口袋。"}]},{"id":"k28f7a3cebf","title":"Fragment与Activity关联","code":"FG-001,5","column":"doing","domain":"Android","kind":"概念","summary":"Activity 管楼和大门，Fragment 只换隔断；单 Activity 是为了导航和状态收拢，不是消灭 Activity。","tags":[],"path":"knowledge/Android/FG-001,5 | Fragment与Activity关联.md","blocks":[{"id":"t-28f7a","type":"text","text":"Fragment 挂在 Activity 上时，各自管什么？为啥现在流行 single Activity + 多 Fragment/Compose？\nActivity 管楼和大门，Fragment 只换隔断；单 Activity 是为了导航和状态收拢，不是消灭 Activity。"}]},{"id":"k1a895d9858","title":"Fragment事务","code":"FG-001,6","column":"doing","domain":"Android","kind":"概念","summary":"replace 拆房间，hide 只关灯；commit 排队，commitNow 当场干完。","tags":[],"path":"knowledge/Android/FG-001,6 | Fragment事务.md","blocks":[{"id":"t-1a895","type":"text","text":"`add` / `replace` / `hide·show` 差在哪？`commit` 和 `commitNow` 呢？为啥回退栈事务不能配 `runOnCommit`？\nreplace 拆房间，hide 只关灯；commit 排队，commitNow 当场干完。"}]},{"id":"k86b8acd138","title":"viewLifecycleOwner","code":"FG-001,7","column":"doing","domain":"Android","kind":"概念","summary":"订阅绑房间（`viewLifecycleOwner`），别绑人，更别 forever 乱碰已拆的 view。","tags":[],"path":"knowledge/Android/FG-001,7 | viewLifecycleOwner.md","blocks":[{"id":"t-86b8a","type":"text","text":"`getActivity()` / `view` 为啥会空？LiveData / Flow 观察该绑谁？为啥不能绑 Fragment 自己或 `observeForever` 乱碰 UI？\n订阅绑房间（`viewLifecycleOwner`），别绑人，更别 forever 乱碰已拆的 view。"}]},{"id":"k1793d621b2","title":"嵌套Fragment","code":"FG-001,8","column":"doing","domain":"Android","kind":"概念","summary":"嵌套用 child；和宿主同级用 support；返回先弹子栈要靠入栈 + primaryNavigation。","tags":[],"path":"knowledge/Android/FG-001,8 | 嵌套Fragment.md","blocks":[{"id":"t-1793d","type":"text","text":"`childFragmentManager`、`parentFragmentManager`、`supportFragmentManager` 各管哪一层？嵌套时系统返回为啥先弹子页？\n嵌套用 child；和宿主同级用 support；返回先弹子栈要靠入栈 + primaryNavigation。"}]},{"id":"kd53b14be33","title":"Fragment传参与状态","code":"FG-001,9","column":"doing","domain":"Android","kind":"概念","summary":"传参用空构造 + arguments；旋转靠 Bundle；别碰 setRetainInstance。","tags":[],"path":"knowledge/Android/FG-001,9 | Fragment传参与状态.md","blocks":[{"id":"t-d53b1","type":"text","text":"给 Fragment 传参为啥不用带参构造器？旋转后 id 靠什么还在？`setRetainInstance` 还能用吗？\n传参用空构造 + arguments；旋转靠 Bundle；别碰 setRetainInstance。"}]},{"id":"ka8fb31aea0","title":"Kotlin","code":"KT-001","column":"doing","domain":"Android","kind":"概念","summary":"先词汇，再 Flow；手册当速查不当第一遍阅读。","tags":[],"path":"knowledge/Android/KT-001 | Kotlin.md","blocks":[{"id":"t-a8fb3","type":"text","text":"在这套库里，Kotlin 要从哪几张卡啃起？\n先词汇，再 Flow；手册当速查不当第一遍阅读。"}]},{"id":"kd2130e76f5","title":"基本概念","code":"KT-001,1","column":"doing","domain":"Android","kind":"概念","summary":"四组词分别谈「怎么拿结果、线程闲不闲、多任务怎么叠、调度粒度多细」。","tags":[],"path":"knowledge/Android/KT-001,1 | 基本概念.md","blocks":[{"id":"t-d2130","type":"text","text":"同步/异步、阻塞/非阻塞、并发/并行、进程/线程/协程——这几组词到底在区分什么？\n四组词分别谈「怎么拿结果、线程闲不闲、多任务怎么叠、调度粒度多细」。"}]},{"id":"kfc888f60f9","title":"Flow 的使用","code":"KT-001,2","column":"doing","domain":"Android","kind":"概念","summary":"Flow = 冷管道——有人接管子（collect）才出水（emit）。","tags":[],"path":"knowledge/Android/KT-001,2 | Flow 的使用.md","blocks":[{"id":"t-fc888","type":"text","text":"Kotlin Flow 是啥？为啥说它是「冷」数据流？\nFlow = 冷管道——有人接管子（collect）才出水（emit）。"}]},{"id":"ke4194cf915","title":"res资源文件夹","code":"PD-001,1","column":"doing","domain":"Android","kind":"概念","summary":"资源放 res，靠文件夹后缀（限定符）自动适配。","tags":[],"path":"knowledge/Android/PD-001,1 | res资源文件夹.md","blocks":[{"id":"t-e4194","type":"text","text":"Android 的资源文件指什么？设备那么碎，系统怎么挑对资源？\n资源放 res，靠文件夹后缀（限定符）自动适配。"}]},{"id":"kdbb61d9c91","title":"drawable目录","code":"PD-001,1,a","column":"doing","domain":"Android","kind":"概念","summary":"drawable = 各种「可画到屏幕上的皮」；先精通图、selector、shape。","tags":[],"path":"knowledge/Android/PD-001,1,a | drawable目录.md","blocks":[{"id":"t-dbb61","type":"text","text":"`res/drawable` 里都能放啥？日常最常用哪几类？\ndrawable = 各种「可画到屏幕上的皮」；先精通图、selector、shape。"}]},{"id":"kac6d0dd6bb","title":"状态列表的使用","code":"PD-001,1,a,1","column":"doing","domain":"Android","kind":"概念","summary":"selector 按状态换皮，顺序越上越优先，默认垫底。","tags":[],"path":"knowledge/Android/PD-001,1,a,1 | 状态列表的使用.md","blocks":[{"id":"t-ac6d0","type":"text","text":"StateListDrawable（selector）怎么让同一个背景随按下/禁用变样？匹配规则是啥？\nselector 按状态换皮，顺序越上越优先，默认垫底。"}]},{"id":"k20c3b22b5e","title":"View状态常量","code":"PD-001,1,a,2","column":"doing","domain":"Android","kind":"概念","summary":"状态常量 = selector 用来「对暗号」的开关名。","tags":[],"path":"knowledge/Android/PD-001,1,a,2 | View状态常量.md","blocks":[{"id":"t-20c3b","type":"text","text":"写 selector / 代码 addState 时，常见 View 状态常量各自表示什么？\n状态常量 = selector 用来「对暗号」的开关名。"}]},{"id":"kfea95ea046","title":"形状可绘制对象","code":"PD-001,1,a,3","column":"doing","domain":"Android","kind":"概念","summary":"shape = 代码/XML 画出来的背景皮，常替代简单切图。","tags":[],"path":"knowledge/Android/PD-001,1,a,3 | 形状可绘制对象.md","blocks":[{"id":"t-fea95","type":"text","text":"`shape` / `GradientDrawable` 适合干什么？XML 里最小怎么写一个圆角渐变？\nshape = 代码/XML 画出来的背景皮，常替代简单切图。"}]},{"id":"ka1b44e2eb2","title":"values目录","code":"PD-001,1,b","column":"doing","domain":"Android","kind":"概念","summary":"values = 给颜色/字串/尺寸/样式起名的地方。","tags":[],"path":"knowledge/Android/PD-001,1,b | values目录.md","blocks":[{"id":"t-a1b44","type":"text","text":"`res/values` 里通常放什么？和布局/图片资源怎么分工？\nvalues = 给颜色/字串/尺寸/样式起名的地方。"}]},{"id":"kcdac94d8ab","title":"记一次主题样式重构","code":"PD-001,1,b,1","column":"doing","domain":"Android","kind":"概念","summary":"主题重构 = 消灭硬编码，让外观走主题属性总线。","tags":[],"path":"knowledge/Android/PD-001,1,b,1 | 记一次主题样式重构.md","blocks":[{"id":"t-cdac9","type":"text","text":"主题/样式一团糟（硬编码、AppCompat/Material 混用、styles/themes 乱放）时，重构的核心原则是啥？\n主题重构 = 消灭硬编码，让外观走主题属性总线。"}]},{"id":"kfc4faffcc5","title":"res资源文件夹下命名规范",       function syncFigure(article, card) {

        const meta = article.querySelector(".meta");
        let fig = article.querySelector(".figure");
        if (!block) {
          if (fig) fig.remove();
          return;
        }
        const key = blockKey(block);
        if (!fig) {
          fig = document.createElement("div");
          fig.className = "figure";
          if (meta) article.insertBefore(fig, meta);
          else article.append(fig);
        }
        if (fig.dataset.key === key && fig.childNodes.length) return;
        fig.dataset.key = key;
        fig.replaceChildren();
        PLUGINS[block.type].mountFace(block, fig);

        link.href = URL.createObjectURL(blob);
        link.download = "知识看板-" + stamp + ".json";
        link.click();
        URL.revokeObjectURL(link.href);
        closeMenu();
      }
      function normalizeCard(card, index) {
        const column = ["todo", "doing", "review", "done"].indexOf(card.column) === -1 ? "doing" : card.column;
        const blocks = Array.isArray(card.blocks) && card.blocks.length ? card.blocks : [PLUGINS.text.create()];
        return {
          id: String(card.id || ("imp-" + index)),
          title: String(card.title || "未命名"),
          code: String(card.code || ""),
          column: column,
          domain: String(card.domain || "Android"),
          kind: String(card.kind || "概念"),
          summary: String(card.summary || ""),
          tags: Array.isArray(card.tags) ? card.tags.map(String) : [],
          path: String(card.path || ""),
          body: typeof card.body === "string" ? card.body : blocksToMarkdown(blocks),
          blocks: blocks
        };
      }
      function importCards(file) {
        const reader = new FileReader();
        reader.onload = function () {
          try {
            const data = JSON.parse(String(reader.result || ""));
            const list = Array.isArray(data) ? data : data.cards;
            if (!Array.isArray(list)) throw new Error("shape");
            const seen = {};
            const next = list.map(normalizeCard).map(function (card) {
              while (seen[card.id]) card.id = card.id + "-2";
              seen[card.id] = true;
              return card;
            });
            api("/api/cards", { method: "PUT", body: JSON.stringify({ cards: next }) }).then(function (data) {
              state.cards = data.cards || next;
              ui.selected = null;
              persist();
              renderBoard();
              updateNav();
              renderInspector();
              toast("已导入 " + state.cards.length + " 张卡。");
            }).catch(function () {
              toast("导入没有写入数据库。");
            });
          } catch (e) {
            toast("这个文件不是看板导出的 JSON。");
          }
        };
        reader.readAsText(file);
      }
      function restore() {
        ask("用 2026-10-31 的知识库快照覆盖数据库？", "数据库里的修改会丢掉。仓库里的 Markdown 不会被改。", "覆盖", true, function () {
          const next = SEED.map(clone);
          api("/api/cards", { method: "PUT", body: JSON.stringify({ cards: next }) }).then(function (data) {
            state.cards = data.cards || next;
            ui.selected = null;
            ui.panel = "read";
            persist();
            renderBoard();
            updateNav();
            renderInspector();
          }).catch(function () {
            toast("快照没有写入数据库。");
          });
        });
      }

      DOMAINS.forEach(function (domain) {
        const btn = el("button", { type: "button", class: "nav-btn", "data-domain": domain });
        btn.append(el("span", { text: domain }), el("span", { class: "n", text: "0" }));
        btn.addEventListener("click", function () {
          ui.domain = domain;
          renderBoard();
          updateNav();
          persistSoon();
          if (window.innerWidth <= 860) closeSidebar();
        });
        document.getElementById("domain-nav").append(btn);
      });
      KINDS.forEach(function (kind) {
        const btn = el("button", { type: "button", class: "nav-btn", "data-kind": kind });
        btn.append(el("span", { text: kind }), el("span", { class: "n", text: "0" }));
        btn.addEventListener("click", function () {
          ui.kind = kind;
          renderBoard();
          updateNav();
          persistSoon();
          if (window.innerWidth <= 860) closeSidebar();
        });
        document.getElementById("kind-nav").append(btn);
      });

      qInput.value = ui.q || "";
      qInput.addEventListener("input", function () {
        ui.q = qInput.value;
        renderBoard();
        updateNav();
        persistSoon();
      });
      clearBtn.addEventListener("click", resetFilter);
      document.getElementById("create").addEventListener("click", createCard);
      document.getElementById("close").addEventListener("click", function () { select(null, false); });
      document.getElementById("export").addEventListener("click", exportCards);
      document.getElementById("import").addEventListener("click", function () { document.getElementById("import-file").click(); });
      document.getElementById("import-file").addEventListener("change", function (e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        closeMenu();
        if (file) importCards(file);
      });
      document.getElementById("restore").addEventListener("click", function () { closeMenu(); restore(); });
      document.getElementById("filter-toggle").addEventListener("click", function () {
        if (sidebar.classList.contains("open")) closeSidebar();
        else openSidebar();
      });
      document.getElementById("filter-toggle").setAttribute("aria-expanded", "false");
      scrim.addEventListener("click", closeSidebar);
      document.querySelectorAll(".appear button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          ui.appearance = btn.dataset.appearance;
          applyMode(true);
          persistSoon();
        });
      });
      document.getElementById("dialog-cancel").addEventListener("click", closeDialog);
      document.getElementById("dialog-ok").addEventListener("click", function () {
        const action = dialogAction;
        closeDialog();
        if (action) action();
      });
      document.addEventListener("click", function (e) {
        const menu = document.getElementById("file-menu");
        if (menu.open && !menu.contains(e.target)) menu.removeAttribute("open");
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (!document.getElementById("dialog").hidden) closeDialog();
          else if (ui.selected) select(null, false);
          else closeSidebar();
          return;
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") {
          e.preventDefault();
          createCard();
        }
        if (e.key === "/" && document.activeElement !== qInput && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
          e.preventDefault();
          qInput.focus();
        }
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (ui.appearance === "system") applyMode(true);
      });

      const mermaidScript = document.querySelector("script[data-mermaid]");
      if (window.mermaid) mermaidState = "ready";
      else if (mermaidScript) {
        mermaidScript.addEventListener("load", function () {
          mermaidState = "ready";
          setupMermaid();
          repaintDiagrams();
        });
        mermaidScript.addEventListener("error", function () {
          mermaidState = "failed";
          repaintDiagrams();
        });
        setTimeout(function () {
          if (mermaidState === "loading") {
            mermaidState = "failed";
            repaintDiagrams();
          }
        }, 8000);
      } else mermaidState = "failed";

      function showDbFoot() {
        api("/api/info").then(function (info) {
          document.getElementById("db-foot").textContent = ["数据库 " + info.db].concat(info.urls || []).join("\n");
        }).catch(function () {
          document.getElementById("db-foot").textContent = "未连上数据库。运行 python3 .cursor/docs/kanban_server.py";
        });
      }
      function boot() {
        applyMode(false);
        setupMermaid();
        api("/api/cards").then(function (data) {
          state.online = true;
          state.cards = data.cards || [];
          if (ui.selected && !cardById(ui.selected)) ui.selected = null;
          renderBoard();
          updateNav();
          renderInspector();
          showDbFoot();
        }).catch(function () {
          state.online = false;
          renderBoard();
          updateNav();
          showDbFoot();
        });
      }
      boot();
    })();
  </script>
  <noscript>知识看板需要在浏览器里运行脚本。</noscript>
</body>
</html>
